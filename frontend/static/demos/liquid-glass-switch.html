                return shader;

            function createProgram(gl) {
                const vertex = compileShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
                const fragment = compileShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
                const program = gl.createProgram();
                gl.attachShader(program, vertex);
                gl.attachShader(program, fragment);
                gl.linkProgram(program);
                gl.deleteShader(vertex);
                gl.deleteShader(fragment);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    const message = gl.getProgramInfoLog(program) || "Program linking failed";
                    gl.deleteProgram(program);
                    throw new Error(message);
                }
                return program;
            }

                context.arcTo(x + width, y + height, x, y + height, r);
                context.arcTo(x, y + height, x, y, r);
                context.arcTo(x, y, x + width, y, r);
                context.closePath();

                                const [lower, upper] = controls;
                                if (
                                    tuningState[lower.key]
                                    > tuningState[upper.key]
                                ) {
                                    if (control.key === lower.key) {
                                        tuningState[lower.key] = tuningState[upper.key];
                                        input.value = String(tuningState[lower.key]);
                                    } else {
                                        tuningState[upper.key] = tuningState[lower.key];
                                        input.value = String(tuningState[upper.key]);
                                    }
                                }
                                rangeRoot
                                    .querySelectorAll("[data-tuning-param]")
                                    .forEach((pairInput) => {
                                        pairInput.value = String(
                                            tuningState[pairInput.dataset.tuningParam]
                                        );
                                    });
                            }
                            renderValue();
                            requestLoop();
                        });
                        rangeRoot.append(input);
                    });

                    wrapper.append(
                        label,
                        pair ? rangeRoot : rangeRoot.firstElementChild
                    );
                    tuningGrid.append(wrapper);
                });
            }

            function resetTuningControls() {
                Object.assign(tuningState, tuningDefaults);
                renderTuningControls();
                requestLoop();
            }

            function isHiddenTree(element) {
                return Boolean(element.closest("[hidden]"));
            }

            function updateColorBlockLayout() {
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;
                const backgroundDpr = getDpr();
                colorBackgroundCanvas.width = Math.max(
                    1,
                    Math.round(viewportWidth * backgroundDpr)
                );
                colorBackgroundCanvas.height = Math.max(
                    1,
                    Math.round(viewportHeight * backgroundDpr)
                );
                colorBackgroundContext.setTransform(
                    backgroundDpr,
                    0,
                    0,
                    backgroundDpr,
                    0,
                    0
                );
                drawColorBlocks(
                    colorBackgroundContext,
                    { left: 0, top: 0 }
                );
                pageBackground.dataset.ready = "true";
            }

            function drawColorBlocks(context, canvasRect) {
                const previewRect = benchPreview?.getBoundingClientRect();
                const left = previewRect
                    ? previewRect.left - canvasRect.left
                    : -canvasRect.left;
                const top = previewRect
                    ? previewRect.top - canvasRect.top
                    : -canvasRect.top;
                const width = previewRect
                    ? previewRect.width
                    : window.innerWidth;
                const height = previewRect
                    ? previewRect.height
                    : window.innerHeight;
                const verticalSplit = window.innerWidth <= 900;
                const splitX = Math.round(width / 2);
                const splitY = Math.round(height / 2);
                context.fillStyle = "rgb(5 5 5)";
                context.fillRect(
                    -canvasRect.left,
                    -canvasRect.top,
                    window.innerWidth,
                    window.innerHeight
                );
                context.fillStyle = "rgb(242 242 238)";
                context.fillRect(
                    left,
                    top,
                    verticalSplit ? width : splitX,
                    verticalSplit ? splitY : height
                );
                context.fillStyle = "rgb(5 5 5)";
                if (verticalSplit) {
                    context.fillRect(left, top + splitY, width, height - splitY);
                } else {
                    context.fillRect(left + splitX, top, width - splitX, height);
                }
            }

            function drawBackgroundCover(context, canvasRect, width, height, bar) {
                context.fillStyle = "#050505";
                context.fillRect(0, 0, width, height);
                if (bar?.sceneSide === "light" || bar?.sceneSide === "dark") {
                    context.fillStyle = bar.sceneSide === "light"
                        ? "rgb(242 242 238)"
                        : "rgb(5 5 5)";
                    context.fillRect(0, 0, width, height);
                    return;
                }
                if (
                    colorBackgroundCanvas.width
                    && colorBackgroundCanvas.height
                ) {
                    context.drawImage(
                        colorBackgroundCanvas,
                        0,
                        0,
                        colorBackgroundCanvas.width,
                        colorBackgroundCanvas.height,
                        -canvasRect.left,
                        -canvasRect.top,
                        window.innerWidth,
                        window.innerHeight
                    );
                }
            }

            function drawSquareSceneText(context, bar, sceneWidth, sceneHeight) {
                const splitRect = benchPreview?.getBoundingClientRect();
                const splitX = splitRect
                    ? splitRect.left + splitRect.width / 2 - bar.canvasRect.left
                    : sceneWidth / 2;
                const centerX = bar.padX + bar.width / 2;
                const centerY = bar.padY + bar.height / 2;
                const largeSize = Math.max(30, Math.min(58, bar.width * 0.22));
                const smallSize = Math.max(12, Math.min(18, bar.width * 0.07));
                const lines = [
                    { text: "PLACEHOLDER TEXT", y: -78, size: smallSize, tracking: 0.12 },
                    { text: "REFRACTION", y: -27, size: largeSize, tracking: -0.055 },
                    { text: "RESULT", y: 31, size: largeSize, tracking: -0.055 },
                    { text: "EDGE SAMPLE", y: 87, size: smallSize, tracking: 0.12 },
                ];

                const drawForSide = (left, width, color, alignBias) => {
                    context.save();
                    context.beginPath();
                    context.rect(left, 0, width, sceneHeight);
                    context.clip();
                    context.translate(centerX + alignBias, centerY);
                    context.rotate(-0.035);
                    context.textAlign = "center";
                    context.textBaseline = "middle";
                    lines.forEach((line) => {
                        context.font = `${line.size >= largeSize ? 820 : 760} ${
                            line.size
                        }px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif`;
                        context.letterSpacing = `${line.tracking}em`;
                        context.fillStyle = color;
                        context.fillText(line.text, 0, line.y);
                    });
                    context.restore();
                };

                drawForSide(0, Math.max(0, splitX), "rgba(5,5,5,0.76)", -66);
                drawForSide(
                    Math.max(0, splitX),
                    Math.max(0, sceneWidth - splitX),
                    "rgba(242,242,238,0.84)",
                    66
                );

                context.save();
                context.globalAlpha = 0.38;
                context.strokeStyle = "rgba(126,130,138,0.46)";
                context.lineWidth = 1;
                context.beginPath();
                context.moveTo(splitX, 0);
                context.lineTo(splitX, sceneHeight);
                context.stroke();
                context.restore();
            }

            function drawBarScene(bar) {
                if (!bar.sceneContext || !bar.width || !bar.height) return;
                const context = bar.sceneContext;
                const dpr = bar.dpr;
                const sceneWidth = bar.canvasCssWidth;
                const sceneHeight = bar.canvasCssHeight;
                const canvasRect = bar.canvasRect;
                const targetWidth = Math.round(sceneWidth * dpr);
                const targetHeight = Math.round(sceneHeight * dpr);

                if (
                    bar.scene.width !== targetWidth
                    || bar.scene.height !== targetHeight
                ) {
                    bar.scene.width = targetWidth;
                    bar.scene.height = targetHeight;
                }
                context.setTransform(dpr, 0, 0, dpr, 0, 0);
                context.clearRect(0, 0, sceneWidth, sceneHeight);
                drawBackgroundCover(
                    context,
                    canvasRect,
                    sceneWidth,
                    sceneHeight,
                    bar
                );

                context.fillStyle = "rgba(7,9,12,0.08)";
                context.fillRect(0, 0, sceneWidth, sceneHeight);
                const tint = Number(bar.root.dataset.sceneTint || 0.12);
                context.fillStyle = `rgba(9,11,15,${tint})`;
                context.fillRect(0, 0, sceneWidth, sceneHeight);
                const quietSelection = Math.max(
                    0,
                    1 - Math.min(1, bar.interaction * 1.35)
                );
                const sizeScale = bar.sizeScale || 1;

                if (bar.type === "square") {
                    drawSquareSceneText(context, bar, sceneWidth, sceneHeight);
                } else if (bar.type === "toggle") {
                    roundedRectPath(
                        context,
                        bar.padX,
                        bar.padY,
                        bar.width,
                        bar.height,
                        bar.height / 2
                    );
                    context.fillStyle = "rgb(30 34 40)";
                    context.fill();
                    context.globalAlpha = bar.toggle.progress;
                    context.fillStyle = "rgb(48 209 88)";
                    context.fill();
                    context.globalAlpha = 1;
                } else if (bar.type === "range") {
                    roundedRectPath(
                        context,
                        bar.padX,
                        bar.padY,
                        bar.width,
                        bar.height,
                        bar.height / 2
                    );
                    context.fillStyle = "rgba(29,32,38,0.76)";
                    context.fill();

                    context.save();
                    roundedRectPath(
                        context,
                        bar.padX,
                        bar.padY,
                        bar.width,
                        bar.height,
                        bar.height / 2
                    );
                    context.clip();
                    const progressGradient = context.createLinearGradient(
                        bar.padX,
                        0,
                        bar.padX + bar.width,
                        0
                    );
                    progressGradient.addColorStop(0, "rgba(48,209,88,0.94)");
                    progressGradient.addColorStop(1, "rgba(68,226,106,0.90)");
                    context.fillStyle = progressGradient;
                    context.fillRect(
                        bar.padX,
                        bar.padY,
                        Math.max(0, Math.min(bar.width, bar.x)),
                        bar.height
                    );
                    context.restore();

                    roundedRectPath(
                        context,
                        bar.padX,
                        bar.padY,
                        bar.width,
                        bar.height,
                        bar.height / 2
                    );
                    context.strokeStyle = "rgba(126,130,138,0.58)";
                    context.lineWidth = 1.4 * sizeScale;
                    context.stroke();

                    if (quietSelection > 0.001) {
                        roundedRectPath(
                            context,
                            bar.padX + bar.x - 32.5 * sizeScale,
                            bar.padY + bar.height / 2 - 21 * sizeScale,
                            65 * sizeScale,
                            42 * sizeScale,
                            21 * sizeScale
                        );
                        context.fillStyle = `rgba(43,47,54,${
                            (quietSelection * 0.96).toFixed(3)
                        })`;
                        context.fill();
                    }
                } else {
                roundedRectPath(
                    context,
                    bar.padX,
                    bar.padY,
                    bar.width,
                    bar.height,
                    bar.height / 2
                );
                context.fillStyle = "rgba(15,17,21,0.54)";
                context.fill();
                context.strokeStyle = "rgba(126,130,138,0.46)";
                context.lineWidth = 1.6;
                context.stroke();

                if (quietSelection > 0.001) {
                    const quietHalfHeight = Math.max(
                        20,
                        bar.height / 2 - 6
                    );
                    const quietHalfWidth = Math.max(
                        bar.segmentWidth * 0.48,
                        quietHalfHeight + 1
                    );
                    roundedRectPath(
                        context,
                        bar.padX + bar.x - quietHalfWidth,
                        bar.padY + bar.height / 2 - quietHalfHeight,
                        quietHalfWidth * 2,
                        quietHalfHeight * 2,
                        quietHalfHeight
                    );
                    context.fillStyle = `rgba(34,38,44,${
                        (quietSelection * 0.88).toFixed(3)
                    })`;
                    context.fill();
                }

                context.save();
                roundedRectPath(
                    context,
                    bar.padX,
                    bar.padY,
                    bar.width,
                    bar.height,
                    bar.height / 2
                );
                context.clip();

                context.strokeStyle = "rgba(125,129,137,0.18)";
                context.lineWidth = 1;
                for (let index = 1; index < bar.count; index += 1) {
                    const x = bar.padX + bar.segmentWidth * index;
                    context.beginPath();
                    context.moveTo(x, bar.padY + 11);
                    context.lineTo(x, bar.padY + bar.height - 11);
                    context.stroke();
                }

                context.font = `${
                    bar.count >= 5 ? 680 : 720
                } ${bar.count >= 5 ? 11 : 13}px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif`;
                context.textAlign = "center";
                context.textBaseline = "middle";
                bar.buttons.forEach((button, index) => {
                    const selected = index === bar.selected;
                    context.fillStyle = selected
                        ? "rgba(241,240,235,0.96)"
                        : "rgba(173,173,169,0.66)";
                    context.fillText(
                        button.dataset.label || button.textContent.trim(),
                        bar.padX + bar.segmentWidth * (index + 0.5),
                        bar.padY + bar.height / 2 + 0.5
                    );
                });
                context.restore();
                }

                const gl = bar.gl;
                if (gl && bar.texture) {
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, bar.texture);
                    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
                    if (
                        bar.textureWidth !== bar.scene.width
                        || bar.textureHeight !== bar.scene.height
                    ) {
                        gl.texImage2D(
                            gl.TEXTURE_2D,
                            0,
                            gl.RGBA,
                            gl.RGBA,
                            gl.UNSIGNED_BYTE,
                            bar.scene
                        );
                        bar.textureWidth = bar.scene.width;
                        bar.textureHeight = bar.scene.height;
                    } else {
                        gl.texSubImage2D(
                            gl.TEXTURE_2D,
                            0,
                            0,
                            0,
                            gl.RGBA,
                            gl.UNSIGNED_BYTE,
                            bar.scene
                        );
                    }
                }
            }

            function renderBar(bar) {
                if (bar.renderer !== "webgl" || !bar.gl || !bar.program) return;
                if (!bar.visible && !bar.dragging) return;
                if (
                    bar.type === "toggle"
                    && bar.interaction < 0.002
                    && !bar.pointerActive
                ) return;
                drawBarScene(bar);

                const gl = bar.gl;
                const dpr = bar.dpr;
                const tuning = globalState.tuning;
                const transitionPulse = bar.transitioning
                    ? Math.sin(bar.transitionProgress * Math.PI) * 0.16
                    : 0;
                const interaction = bar.motionOff
                    ? 0
                    : Math.min(1, bar.interaction + transitionPulse);
                const speed = Math.min(1, Math.abs(bar.velocityUnit));
                const motionStretch =
                    speed * interaction * tuning.motionStretch;
                const sizeScale = Math.max(
                    0.55,
                    Math.min(1.15, bar.sizeScale || 1)
                );
                const squareBase = Math.min(bar.width, bar.height);
                const idleHalfHeight = bar.type === "square"
                    ? Math.max(72, squareBase * 0.36)
                    : bar.type === "range"
                    ? 21 * sizeScale
                    : bar.type === "toggle"
                        ? 25 * sizeScale
                        : Math.max(20, bar.height / 2 - 6);
                const dragHalfHeight = bar.type === "square"
                    ? Math.max(92, squareBase * 0.45)
                    : bar.type === "range"
                    ? 34 * sizeScale
                    : bar.type === "toggle"
                        ? 41.25 * sizeScale
                        : bar.height / 2 + 15;
                const idleHalfWidth = bar.type === "square"
                    ? idleHalfHeight
                    : bar.type === "range"
                    ? 32.5 * sizeScale
                    : bar.type === "toggle"
                        ? 37 * sizeScale
                        : Math.max(
                            bar.segmentWidth * 0.48,
                            idleHalfHeight + 1
                        );
                const dragHalfWidth = bar.type === "square"
                    ? dragHalfHeight
                    : bar.type === "range"
                    ? 53.6 * sizeScale
                    : bar.type === "toggle"
                        ? 61.05 * sizeScale
                        : Math.max(
                            bar.segmentWidth * 0.60,
                            dragHalfHeight + 1
                        );
                const halfWidth = (
                    idleHalfWidth
                    + (dragHalfWidth - idleHalfWidth) * interaction
                    + speed
                        * interaction
                        * (
                            bar.type === "range"
                                ? 9 * sizeScale
                                : bar.type === "toggle"
                                    ? 11.1 * sizeScale
                                    : bar.segmentWidth * 0.055
                        )
                    + motionStretch
                        * (
                            bar.type === "range"
                                ? 22 * sizeScale
                                : bar.type === "toggle"
                                    ? 18 * sizeScale
                                    : bar.segmentWidth * 0.11
                        )
                ) * dpr;
                const halfHeight = (
                    idleHalfHeight
                    + (dragHalfHeight - idleHalfHeight) * interaction
                    - speed
                        * interaction
                        * (bar.type === "toggle" ? 7.5 * sizeScale : 3 * sizeScale)
                    - motionStretch
                        * (
                            bar.type === "toggle"
                                ? 10 * sizeScale
                                : 4 * sizeScale
                        )
                ) * dpr;
                const lensCenterX = (bar.padX + bar.x) * dpr;
                const lensCenterY = (bar.padY + bar.height / 2) * dpr;

                gl.useProgram(bar.program);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, bar.texture);
                gl.uniform2f(
                    bar.uniforms.resolution,
                    bar.canvas.width,
                    bar.canvas.height
                );
                gl.uniform2f(
                    bar.uniforms.trackCenter,
                    (bar.padX + bar.width / 2) * dpr,
                    (bar.padY + bar.height / 2) * dpr
                );
                gl.uniform2f(
                    bar.uniforms.trackHalfSize,
                    bar.width / 2 * dpr,
                    bar.height / 2 * dpr
                );
                gl.uniform2f(
                    bar.uniforms.lensCenter,
                    lensCenterX,
                    lensCenterY
                );
                gl.uniform2f(
                    bar.uniforms.lensHalfSize,
                    halfWidth,
                    halfHeight
                );
                gl.uniform1f(bar.uniforms.interaction, interaction);
                gl.uniform1f(bar.uniforms.strength, globalState.strength);
                gl.uniform1f(bar.uniforms.pixelRatio, dpr);
                gl.uniform1f(bar.uniforms.velocity, bar.velocityUnit);
                gl.uniform1f(
                    bar.uniforms.trackVisibility,
                    bar.type === "toggle" || bar.type === "square" ? 0 : 1
                );
                gl.uniform1f(
                    bar.uniforms.neutralWeight,
                    bar.type === "switch" || bar.type === "square" ? 1 : 0
                );
                gl.uniform1f(
                    bar.uniforms.shapeMode,
                    bar.type === "square" ? 1 : 0
                );
                gl.uniform4f(
                    bar.uniforms.shapeTuning,
                    tuning.edgeIdle * sizeScale,
                    tuning.edgeActive * sizeScale,
                    tuning.centerShrink,
                    tuning.floatingShrink
                );
                gl.uniform4f(
                    bar.uniforms.innerTuning,
                    tuning.innerSpanTrack,
                    tuning.innerSpanFloating,
                    0,
                    0
                );
                gl.uniform4f(
                    bar.uniforms.blendTuning,
                    tuning.innerMixMin,
                    tuning.innerMixMax,
                    tuning.rimFoldStart,
                    tuning.rimFoldMix
                );
                gl.uniform4f(
                    bar.uniforms.edgeTuning,
                    0,
                    tuning.edgeCrispStart,
                    tuning.edgeCrispEnd,
                    tuning.chromaShift * sizeScale
                );
                gl.uniform4f(
                    bar.uniforms.rimTuning,
                    tuning.rimWidth * sizeScale,
                    tuning.rimStrength,
                    tuning.shoulderWidth * sizeScale,
                    tuning.coreWidth * sizeScale
                );
                gl.uniform4f(
                    bar.uniforms.roundTuning,
                    tuning.sideRoundMin,
                    tuning.sideRoundMax,
                    tuning.chromaMin,
                    tuning.chromaMax
                );
                gl.uniform4f(
                    bar.uniforms.transitionTuning,
                    tuning.transitionSpread * sizeScale,
                    tuning.transitionDecay,
                    tuning.rgbBandWidth * sizeScale,
                    tuning.edgeTaper
                );
                gl.uniform4f(
                    bar.uniforms.opticTuning,
                    tuning.transmission,
                    tuning.ambientFill,
                    tuning.magnification,
                    tuning.edgeRefraction
                );
                gl.uniform4f(
                    bar.uniforms.lightTuning,
                    tuning.fresnelStrength,
                    tuning.specularStrength,
                    tuning.innerRimStrength,
                    tuning.darkRimStrength
                );
                gl.uniform4f(
                    bar.uniforms.kubeTuning,
                    tuning.refractionLevel * sizeScale,
                    tuning.progressiveBlur * sizeScale,
                    tuning.blurLevel * sizeScale,
                    tuning.glassBackgroundOpacity
                );
                gl.uniform4f(
                    bar.uniforms.kubeMaterialTuning,
                    tuning.specularOpacity,
                    tuning.specularSaturation,
                    0,
                    0
                );
                gl.drawArrays(gl.TRIANGLES, 0, 3);

                const trackTop = bar.rootRect.top;
                const trackBottom = bar.rootRect.bottom;
                const lensTop = bar.canvasRect.top + lensCenterY / dpr - halfHeight / dpr;
                const lensBottom = bar.canvasRect.top + lensCenterY / dpr + halfHeight / dpr;
                const lensLeft = bar.canvasRect.left
                    + lensCenterX / dpr
                    - halfWidth / dpr;
                const lensRight = bar.canvasRect.left
                    + lensCenterX / dpr
                    + halfWidth / dpr;
                const lensOverflow = Math.max(
                    trackTop - lensTop,
                    lensBottom - trackBottom,
                    0
                );
                bar.maxLensOverflow = Math.max(
                    bar.maxLensOverflow,
                    lensOverflow
                );
                const canvasClip = Math.max(
                    bar.canvasRect.left - lensLeft,
                    lensRight - bar.canvasRect.right,
                    bar.canvasRect.top - lensTop,
                    lensBottom - bar.canvasRect.bottom,
                    0
                );
                bar.maxCanvasClip = Math.max(
                    bar.maxCanvasClip,
                    canvasClip
                );
                bar.root.dataset.dragging = String(bar.dragging);
                bar.root.dataset.glassActive = String(interaction >= 0.08);
                bar.root.dataset.chromaticLayer = interaction >= 0.08
                    ? "inner"
                    : "none";
                bar.root.dataset.trackTop = trackTop.toFixed(2);
                bar.root.dataset.trackBottom = trackBottom.toFixed(2);
                bar.root.dataset.lensTop = lensTop.toFixed(2);
                bar.root.dataset.lensBottom = lensBottom.toFixed(2);
                bar.root.dataset.lensHalfWidth = (halfWidth / dpr).toFixed(2);
                bar.root.dataset.lensHalfHeight = (halfHeight / dpr).toFixed(2);
                bar.root.dataset.maxLensOverflow = bar.maxLensOverflow.toFixed(2);
                bar.root.dataset.maxCanvasClip = bar.maxCanvasClip.toFixed(2);
                bar.root.dataset.lensCenterX = bar.x.toFixed(2);
                bar.root.dataset.targetCenterX = bar.targetX.toFixed(2);
                bar.root.dataset.centerOffsetPx = "0";
                bar.root.dataset.edgeOffsetPx = (
                    3.0 + (5.8 - 3.0) * globalState.strength
                ).toFixed(2);
                bar.root.dataset.apxSize = bar.apxSize || "md";
                bar.root.dataset.sizeScale = sizeScale.toFixed(2);
                bar.root.dataset.effectiveEdgeActivePx = (
                    tuning.edgeActive * sizeScale
                ).toFixed(2);
                bar.root.dataset.effectiveRgbBandWidthPx = (
                    tuning.rgbBandWidth * sizeScale
                ).toFixed(2);
            }

            function initWebGL(bar) {
                try {
                    const gl = bar.canvas.getContext("webgl2", {
                        alpha: true,
                        antialias: false,
                        depth: false,
                        stencil: false,
                        premultipliedAlpha: true,
                        preserveDrawingBuffer: false,
                        powerPreference: "high-performance",
                    });
                    if (!gl) throw new Error("WebGL2 unavailable");

                    const program = createProgram(gl);
                    const texture = gl.createTexture();
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

                    gl.useProgram(program);
                    const sceneUniform = gl.getUniformLocation(program, "uScene");
                    gl.uniform1i(sceneUniform, 0);
                    gl.enable(gl.BLEND);
                    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

                    bar.gl = gl;
                    bar.program = program;
                    bar.texture = texture;
                    bar.textureWidth = 0;
                    bar.textureHeight = 0;
                    bar.uniforms = {
                        resolution: gl.getUniformLocation(program, "uResolution"),
                        trackCenter: gl.getUniformLocation(program, "uTrackCenterPx"),
                        trackHalfSize: gl.getUniformLocation(program, "uTrackHalfSizePx"),
                        lensCenter: gl.getUniformLocation(program, "uLensCenterPx"),
                        lensHalfSize: gl.getUniformLocation(program, "uLensHalfSizePx"),
                        interaction: gl.getUniformLocation(program, "uInteraction"),
                        strength: gl.getUniformLocation(program, "uStrength"),
                        pixelRatio: gl.getUniformLocation(program, "uPixelRatio"),
                        velocity: gl.getUniformLocation(program, "uVelocity"),
                        trackVisibility: gl.getUniformLocation(
                            program,
                            "uTrackVisibility"
                        ),
                        neutralWeight: gl.getUniformLocation(
                            program,
                            "uNeutralWeight"
                        ),
                        shapeMode: gl.getUniformLocation(
                            program,
                            "uShapeMode"
                        ),
                        shapeTuning: gl.getUniformLocation(
                            program,
                            "uShapeTuning"
                        ),
                        innerTuning: gl.getUniformLocation(
                            program,
                            "uInnerTuning"
                        ),
                        blendTuning: gl.getUniformLocation(
                            program,
                            "uBlendTuning"
                        ),
                        edgeTuning: gl.getUniformLocation(
                            program,
                            "uEdgeTuning"
                        ),
                        rimTuning: gl.getUniformLocation(
                            program,
                            "uRimTuning"
                        ),
                        roundTuning: gl.getUniformLocation(
                            program,
                            "uRoundTuning"
                        ),
                        transitionTuning: gl.getUniformLocation(
                            program,
                            "uTransitionTuning"
                        ),
                        opticTuning: gl.getUniformLocation(
                            program,
                            "uOpticTuning"
                        ),
                        lightTuning: gl.getUniformLocation(
                            program,
                            "uLightTuning"
                        ),
                        kubeTuning: gl.getUniformLocation(
                            program,
                            "uKubeTuning"
                        ),
                        kubeMaterialTuning: gl.getUniformLocation(
                            program,
                            "uKubeMaterialTuning"
                        ),
                    };
                    bar.renderer = "webgl";
                    bar.root.dataset.renderer = "webgl";
                    return true;
                } catch (error) {
                    bar.renderer = "css";
                    bar.root.dataset.renderer = "css";
                    globalState.contextFailures += 1;
                    return false;

            function updateRendererBadge() {
                const webglCount = globalState.bars.filter(
                    (bar) => bar.renderer === "webgl"
                ).length;
                const pendingLazy = globalState.bars.filter(
                    (bar) => bar.lazyRenderer && !bar.rendererAttempted
                ).length;
                const requiredBars = globalState.bars.filter(
                    (bar) => !bar.lazyRenderer || bar.rendererAttempted
                );
                const hasRequiredFailure = requiredBars.some(
                    (bar) => bar.renderer !== "webgl"
                );
                globalState.contexts = webglCount;
                const renderer = webglCount > 0 && !hasRequiredFailure
                    ? "webgl"
                    : webglCount > 0
                        ? "mixed"
                        : "css";
                rendererBadge.textContent = renderer === "webgl"
                    ? pendingLazy
                        ? `${webglCount}× WebGL · ${pendingLazy} on-demand`
                        : `${webglCount}× WebGL · shared scene`
                    : renderer === "mixed"
                        ? `${webglCount}/${requiredBars.length} WebGL`
                        : "CSS fallback";
                window.__liquidGlassDiagnostics.renderer = renderer;
                window.__liquidGlassDiagnostics.contexts = globalState.contexts;
                window.__liquidGlassDiagnostics.contextFailures = globalState.contextFailures;

            function resizeBar(bar) {
                if (bar.lazyRenderer && !bar.gl) return;
                bar.rootRect = bar.root.getBoundingClientRect();
                bar.width = Math.max(1, bar.rootRect.width);
                bar.height = Math.max(1, bar.rootRect.height);
                const apxSize = APX_SIZE_PRESETS[bar.apxSize]
                    || APX_SIZE_PRESETS.md;
                bar.segmentWidth = bar.type === "range" || bar.type === "square"
                    ? bar.width
                    : bar.width / bar.count;
                bar.padX = bar.type === "square"
                    ? 82
                    : bar.type === "range"
                    ? apxSize.rangePadXPx
                    : bar.type === "toggle"
                        ? apxSize.toggleCanvasPadPx
                        : apxSize.switchPadXPx;
                bar.padY = bar.type === "square"
                    ? 82
                    : bar.type === "range"
                    ? (
                        window.innerWidth <= 520 && bar.apxSize === "md"
                            ? 36
                            : apxSize.rangePadYPx
                    )
                    : bar.type === "toggle"
                        ? apxSize.toggleCanvasPadPx
                        : (
                            window.innerWidth <= 520 && bar.apxSize === "md"
                                ? 28
                                : apxSize.switchPadYPx
                        );
                bar.dpr = getDpr();
                bar.canvasRect = bar.canvas.getBoundingClientRect();
                bar.canvasCssWidth = Math.max(1, bar.canvasRect.width);
                bar.canvasCssHeight = Math.max(1, bar.canvasRect.height);
                const bitmapWidth = Math.max(
                    1,
                    Math.round(bar.canvasCssWidth * bar.dpr)
                );
                const bitmapHeight = Math.max(
                    1,
                    Math.round(bar.canvasCssHeight * bar.dpr)
                );
                if (bar.canvas.width !== bitmapWidth) {
                    bar.canvas.width = bitmapWidth;
                }
                if (bar.canvas.height !== bitmapHeight) {
                    bar.canvas.height = bitmapHeight;
                }
                if (bar.gl) {
                    bar.gl.viewport(0, 0, bar.canvas.width, bar.canvas.height);
                }
                if (bar.type === "range") {
                    const min = Number(bar.input.min);
                    const max = Number(bar.input.max);
                    const ratio = (Number(bar.input.value) - min) / (max - min);
                    bar.targetX = ratio * bar.width;
                } else if (bar.type === "square") {
                    bar.targetX = bar.width / 2;
                } else {
                    bar.targetX = bar.segmentWidth * (bar.selected + 0.5);

                const next = Math.max(
                    0,
                    Math.min(bar.count - 1, Number(nextIndex) || 0)

                bar.selected = next;
                bar.root.style.setProperty("--selected-index", String(next));
                bar.targetX = bar.segmentWidth * (next + 0.5);

                bar.buttons.forEach((button, index) => {

                        panel.classList.toggle("is-active", selected);

                    announcer.textContent = `${
                        bar.buttons[next].dataset.label

                    Math.min(1, 0.2 + activity * 0.8).toFixed(4)
                );
                toggle.root.style.setProperty(
                    "--toggle-bridge-opacity",
                    Math.min(0.48, activity * 0.48).toFixed(4)
                );
                toggle.root.dataset.dragging = String(toggle.dragging);
                toggle.root.dataset.progress = toggle.progress.toFixed(4);
                toggle.root.dataset.activity = activity.toFixed(4);
                toggle.root.dataset.glassActive = String(glass >= 0.08);
                toggle.root.dataset.chromaticLayer = glass >= 0.08
                    ? "inner"
                    : "none";

                if (toggle.glassBar) {
                    const glassBar = toggle.glassBar;
                    glassBar.x =
                        toggle.lensBaseX + toggle.progress * toggle.travelPx;
                    glassBar.targetX =
                        toggle.lensBaseX + toggle.target * toggle.travelPx;
                    glassBar.velocityX = toggle.velocityPx;
                    glassBar.velocityUnit = Math.max(
                        -1,
                        Math.min(1, toggle.velocityPx / (12 * toggle.sizeScale))
                    );
                    glassBar.interaction = glass;
                    glassBar.pointerActive = toggle.pointerActive;
                    glassBar.dragging = toggle.dragging;
                    glassBar.selected = toggle.committed;
                    glassBar.motionOff = toggle.motionOff;
                }
            }

            function setLiquidToggleTarget(toggle, next, options = {}) {
                toggle.target = next >= 0.5 ? 1 : 0;
                toggle.delayMs = options.delayMs || 0;
                toggle.releaseHoldMs = 0;
                toggle.root.setAttribute(
                    "aria-checked",
                    String(toggle.target === 1)
                );
                toggle.status.textContent = toggle.target === 1 ? "On" : "Off";
                announcer.textContent = `${
                    toggle.root.getAttribute("aria-label")
                } ${toggle.target === 1 ? "on" : "off"}`;
                requestLoop();
            }

            function endLiquidTogglePointer(toggle, event) {
                if (
                    !toggle.pointerActive
                    || event.pointerId !== toggle.pointerId
                ) return;
                const cancelled = event.type === "pointercancel";
                const elapsed = performance.now() - toggle.pressTime;
                const distance = Math.abs(event.clientX - toggle.startClientX);
                const wasDragging = toggle.dragging;
                toggle.pointerActive = false;
                toggle.dragging = false;
                toggle.pointerId = null;
                if (toggle.root.hasPointerCapture?.(event.pointerId)) {
                    toggle.root.releasePointerCapture(event.pointerId);
                }

                if (cancelled) {
                    setLiquidToggleTarget(toggle, toggle.committed);
                } else if (wasDragging) {
                    setLiquidToggleTarget(toggle, toggle.progress >= 0.5 ? 1 : 0);
                } else if (elapsed <= 500 && distance <= 6) {
                    setLiquidToggleTarget(toggle, toggle.committed ? 0 : 1, {
                        delayMs: 120,
                    });
                } else {
                    setLiquidToggleTarget(toggle, toggle.committed);
                }
                toggle.committed = toggle.target;
                toggle.releaseHoldMs = wasDragging ? 45 : 50;
                toggle.suppressPointerClick = true;
                window.setTimeout(() => {
                    toggle.suppressPointerClick = false;
                }, 0);
                requestLoop();
            }

            function createLiquidToggle(root) {
                const initial = Number(root.dataset.initial) >= 0.5 ? 1 : 0;
                const demoHoldActive = root.dataset.demoActive === "true";
                const apxSize = resolveApxSize(root);
                root.style.setProperty(
                    "--toggle-anchor",
                    `${apxSize.toggleAnchorPx}px`
                );
                root.style.setProperty(
                    "--toggle-canvas-pad",
                    `${apxSize.toggleCanvasPadPx}px`
                );
                const toggle = {
                    root,
                    status: root.closest(".liquid-toggle-row")
                        .querySelector("[data-toggle-status]"),
                    apxSize: apxSize.key,
                    sizeScale: apxSize.scale,
                    travelPx: apxSize.toggleTravelPx,
                    lensBaseX: apxSize.toggleLensBaseX,
                    thumbWidthPx: apxSize.toggleThumbWidthPx,
                    thumbHeightPx: apxSize.toggleThumbHeightPx,
                    progress: initial,
                    target: initial,
                    committed: initial,
                    activity: demoHoldActive ? 1 : 0,
                    activityVelocity: 0,
                    velocityPx: 0,
                    demoHoldActive,
                    pointerActive: false,
                    dragging: false,
                    pointerId: null,
                    startClientX: 0,
                    startProgress: initial,
                    pressTime: 0,
                    delayMs: 0,
                    releaseHoldMs: 0,
                    suppressPointerClick: false,
                    motionOff: demoHoldActive ? false : reduceMotionQuery.matches,
                };

                if (demoHoldActive) {
                    root.setAttribute("aria-disabled", "true");
                    root.dataset.demoHeld = "true";
                } else {
                    root.addEventListener("pointerdown", (event) => {
                        if (event.pointerType === "mouse" && event.button !== 0) return;
                        ensureToggleGlassRenderer(toggle);
                        toggle.pointerActive = true;
                        toggle.dragging = false;
                        toggle.pointerId = event.pointerId;
                        toggle.startClientX = event.clientX;
                        toggle.startProgress = toggle.progress;
                        toggle.pressTime = performance.now();
                        toggle.delayMs = 0;
                        toggle.releaseHoldMs = 0;
                        toggle.velocityPx = 0;
                        root.setPointerCapture?.(event.pointerId);
                        requestLoop();
                    });

                    root.addEventListener("pointermove", (event) => {
                        if (
                            !toggle.pointerActive
                            || event.pointerId !== toggle.pointerId
                        ) return;
                        const dx = event.clientX - toggle.startClientX;
                        if (!toggle.dragging && Math.abs(dx) <= 6) return;
                        toggle.dragging = true;
                        const previous = toggle.progress;
                        toggle.progress = Math.max(
                            0,
                            Math.min(
                                1,
                                toggle.startProgress + dx / toggle.travelPx
                            )
                        );
                        toggle.velocityPx = (
                            toggle.progress - previous
                        ) * toggle.travelPx;
                        requestLoop();
                    });

                    root.addEventListener("pointerup", (event) => {
                        endLiquidTogglePointer(toggle, event);
                    });
                    root.addEventListener("pointercancel", (event) => {
                        endLiquidTogglePointer(toggle, event);
                    });
                    root.addEventListener("lostpointercapture", (event) => {
                        if (toggle.pointerActive) {
                            endLiquidTogglePointer(toggle, event);
                        }
                    });
                    root.addEventListener("click", (event) => {
                        if (event.detail !== 0 || toggle.suppressPointerClick) {
                            event.preventDefault();
                            return;
                        }
                        ensureToggleGlassRenderer(toggle);
                        setLiquidToggleTarget(toggle, toggle.committed ? 0 : 1, {
                            delayMs: reduceMotionQuery.matches ? 0 : 80,
                        });
                        toggle.committed = toggle.target;
                    });
                    root.addEventListener("focus", () => {
                        ensureToggleGlassRenderer(toggle);
                    });
                }

                createToggleGlassBar(toggle);
                if (demoHoldActive) ensureToggleGlassRenderer(toggle);
                globalState.toggles.push(toggle);
                renderLiquidToggle(toggle);
                return toggle;
            }

            function updateLiquidToggle(toggle, dt) {
                if (toggle.demoHoldActive) {
                    toggle.progress = toggle.target;
                    toggle.activity = 1;
                    toggle.activityVelocity = 0;
                    toggle.velocityPx = 0;
                    renderLiquidToggle(toggle);
                    return;
                }

                const frameScale = Math.max(0.5, Math.min(2, dt / 16.667));
                if (toggle.motionOff) {
                    toggle.progress = toggle.target;
                    toggle.activity = 0;
                    toggle.activityVelocity = 0;
                    toggle.velocityPx = 0;
                    renderLiquidToggle(toggle);
                    return;
                }

                toggle.delayMs = Math.max(0, toggle.delayMs - dt);
                toggle.releaseHoldMs = Math.max(0, toggle.releaseHoldMs - dt);
                const wasMoving = Math.abs(toggle.target - toggle.progress) >= 0.001;

                if (
                    !toggle.pointerActive
                    && !toggle.dragging
                    && toggle.delayMs <= 0
                    && wasMoving
                ) {
                    const previous = toggle.progress;
                    const ease = 1 - Math.exp(-dt / 48);
                    toggle.progress += (toggle.target - toggle.progress) * ease;
                    toggle.velocityPx = (
                        toggle.progress - previous
                    ) * toggle.travelPx;
                    if (Math.abs(toggle.target - toggle.progress) < 0.001) {
                        toggle.progress = toggle.target;
                        toggle.releaseHoldMs = 50;
                    }
                } else if (!toggle.dragging) {
                    toggle.velocityPx *= Math.pow(0.58, frameScale);
                }

                const moving = (
                    toggle.delayMs > 0
                    || Math.abs(toggle.target - toggle.progress) >= 0.001
                );
                const active = (
                    toggle.pointerActive
                    || toggle.dragging
                    || moving
                    || toggle.releaseHoldMs > 0
                );

                if (active) {
                    toggle.activityVelocity += (
                        1 - toggle.activity
                    ) * 0.25 * frameScale;
                    toggle.activityVelocity *= Math.pow(0.68, frameScale);
                    toggle.activity += toggle.activityVelocity * frameScale;
                    toggle.activity = Math.min(1.16, toggle.activity);
                } else {
                    toggle.activityVelocity = 0;
                    toggle.activity += (
                        0 - toggle.activity
                    ) * (1 - Math.exp(-dt / 62));
                    if (toggle.activity < 0.002) toggle.activity = 0;
                }

                renderLiquidToggle(toggle);
            }

            function startBarTransition(bar, duration) {
                const distance = Math.abs(bar.targetX - bar.x);
                if (distance < 0.05 || bar.motionOff) {
                    bar.x = bar.targetX;
                    bar.transitioning = false;
                    bar.transitionProgress = 1;
                    return;
                }
                bar.transitionStartX = bar.x;
                bar.transitionElapsed = 0;
                bar.transitionDuration = duration || Math.max(
                    140,
                    Math.min(220, 145 + distance / Math.max(bar.width, 1) * 90)
                );
                bar.transitionProgress = 0;
                bar.transitioning = true;
                bar.releaseHoldMs = 0;
                requestLoop();
            }

            function barsAreSettled() {
                const barsSettled = globalState.bars.every((bar) => (
                    !bar.pointerActive
                    && !bar.dragging
                    && !bar.transitioning
                    && Math.abs(bar.x - bar.targetX) < 0.05
                    && Math.abs(bar.velocityX) < 0.04
                    && (bar.demoHoldActive || bar.interaction < 0.002)
                ));
                const togglesSettled = globalState.toggles.every((toggle) => (
                    toggle.demoHoldActive
                    || (
                        !toggle.pointerActive
                        && !toggle.dragging
                        && Math.abs(toggle.progress - toggle.target) < 0.001
                        && toggle.activity < 0.002
                    )
                ));
                return barsSettled && togglesSettled;
            }

            function updateBarMotion(bar, dt) {
                if (bar.externalMotion) return;
                if (bar.demoHoldActive) {
                    bar.x = bar.targetX;
                    bar.velocityX = 0;
                    bar.velocityUnit = 0;
                    bar.interaction = 1;
                    bar.transitioning = false;
                    bar.dragging = false;
                    bar.pointerActive = false;
                    return;
                }
                const frameScale = Math.max(0.5, Math.min(2, dt / 16.667));
                if (bar.motionOff) {
                    bar.x = bar.targetX;
                    bar.velocityX = 0;
                    bar.velocityUnit = 0;
                    bar.interaction = 0;
                    bar.transitioning = false;
                    return;
                }

                bar.releaseHoldMs = Math.max(0, bar.releaseHoldMs - dt);
                const movingToTarget = (
                    bar.transitioning
                    || Math.abs(bar.targetX - bar.x) >= 0.05
                );
                const lensHeldOpen = (
                    bar.pointerActive
                    || bar.dragging
                    || movingToTarget
                    || bar.releaseHoldMs > 0
                );
                const desiredInteraction = lensHeldOpen ? 1 : 0;
                const interactionRate = lensHeldOpen ? 0.38 : 0.24;
                bar.interaction += (
                    desiredInteraction - bar.interaction
                ) * interactionRate * frameScale;

                const previousX = bar.x;
                if (bar.dragging) {
                    const dragSpeed = bar.velocityX / Math.max(
                        bar.type === "range"
                            ? 18 * (bar.sizeScale || 1)
                            : bar.segmentWidth * 0.12,
                        1
                    );
                    bar.velocityUnit += (
                        Math.max(-1, Math.min(1, dragSpeed))
                        - bar.velocityUnit
                    ) * 0.45;
                    return;
                }

                if (
                    !bar.transitioning
                    && Math.abs(bar.targetX - bar.x) >= 0.05
                ) {
                    startBarTransition(bar);
                }

                if (bar.transitioning) {
                    bar.transitionElapsed += dt;
                    const progress = Math.min(
                        1,
                        bar.transitionElapsed / bar.transitionDuration
                    );
                    const springBase = 1 - Math.pow(1 - progress, 3);
                    const springOvershoot =
                        Math.sin(progress * Math.PI * 1.35)
                        * (1 - progress)
                        * 0.038;
                    const eased = Math.max(
                        0,
                        Math.min(1.04, springBase + springOvershoot)
                    );
                    bar.transitionProgress = progress;
                    bar.x = bar.transitionStartX
                        + (bar.targetX - bar.transitionStartX) * eased;
                    if (progress >= 1) {
                        bar.x = bar.targetX;
                        bar.transitioning = false;
                        bar.releaseHoldMs = 50;
                    }
                }

                bar.velocityX = bar.x - previousX;
                const rawVelocity = bar.velocityX / Math.max(
                    bar.type === "range"
                        ? 18 * (bar.sizeScale || 1)
                        : bar.segmentWidth * 0.12,
                    1
                );
                bar.velocityUnit += (
                    Math.max(-1, Math.min(1, rawVelocity))
                    - bar.velocityUnit
                ) * 0.38;
                if (!bar.transitioning) {
                    bar.velocityUnit *= Math.pow(0.62, frameScale);
                }

                if (
                    !bar.transitioning
                    && Math.abs(bar.targetX - bar.x) < 0.05
                    && Math.abs(bar.velocityX) < 0.04
                    && bar.interaction < 0.002
                ) {
                    bar.x = bar.targetX;
                    bar.velocityX = 0;
                    bar.velocityUnit = 0;
                    bar.interaction = 0;
                }
            }

            function updateDiagnostics(active) {
                const edgeOffset = 3.0 + (5.8 - 3.0) * globalState.strength;
                window.__liquidGlassDiagnostics.frames = globalState.frames;
                window.__liquidGlassDiagnostics.idle = !active;
                window.__liquidGlassDiagnostics.dpr = globalState.dpr;
                window.__liquidGlassDiagnostics.sceneVersion = globalState.frames;
                window.__liquidGlassDiagnostics.centerOffsetPx = 0;
                window.__liquidGlassDiagnostics.edgeOffsetPx = edgeOffset;
                window.__liquidGlassDiagnostics.bars = globalState.bars.map((bar) => ({
                    id: bar.root.id,
                    renderer: bar.renderer,
                    visible: bar.visible,
                    apxSize: bar.apxSize || "md",
                    sizeScale: Number(bar.root.dataset.sizeScale || 1),
                    effectiveEdgeActivePx: Number(
                        bar.root.dataset.effectiveEdgeActivePx || 0
                    ),
                    effectiveRgbBandWidthPx: Number(
                        bar.root.dataset.effectiveRgbBandWidthPx || 0
                    ),
                    dragging: bar.dragging,
                    trackTop: Number(bar.root.dataset.trackTop || 0),
                    trackBottom: Number(bar.root.dataset.trackBottom || 0),
                    lensTop: Number(bar.root.dataset.lensTop || 0),
                    lensBottom: Number(bar.root.dataset.lensBottom || 0),
                    lensHalfWidth: Number(bar.root.dataset.lensHalfWidth || 0),
                    lensHalfHeight: Number(bar.root.dataset.lensHalfHeight || 0),
                    maxLensOverflow: Number(bar.root.dataset.maxLensOverflow || 0),
                    maxCanvasClip: Number(bar.root.dataset.maxCanvasClip || 0),
                    lensCenterX: Number(bar.root.dataset.lensCenterX || 0),
                    targetCenterX: Number(bar.root.dataset.targetCenterX || 0),
                    centerOffsetPx: 0,
                    edgeOffsetPx: edgeOffset,
                }));
                stage.dataset.frameCount = String(globalState.frames);
                stage.dataset.idle = String(!active);
                rendererBadge.dataset.state = active ? "active" : "idle";
            }

            function requestLoop() {
                if (globalState.raf || document.hidden) return;
                globalState.lastTime = 0;
                globalState.raf = window.requestAnimationFrame(tick);
                updateDiagnostics(true);
            }

            function stopLoop() {
                if (globalState.raf) {
                    window.cancelAnimationFrame(globalState.raf);
                }
                globalState.raf = 0;
                globalState.lastTime = 0;
                updateDiagnostics(false);
            }

            function tick(now) {
                const elapsed = globalState.lastTime
                    ? now - globalState.lastTime
                    : 16.667;
                globalState.raf = 0;
                if (
                    globalState.lastTime
                    && elapsed < 14
                    && !globalState.geometryDirty
                ) {
                    globalState.raf = window.requestAnimationFrame(tick);
                    return;
                }
                const rawDt = elapsed;
                const dt = Math.min(Math.max(rawDt, 4), 32);
                globalState.lastTime = now;

                if (globalState.geometryDirty) {
                    globalState.dpr = 1;
                    globalState.bars.forEach((bar) => resizeBar(bar));
                    globalState.geometryDirty = false;
                }
                globalState.toggles.forEach((toggle) => {
                    updateLiquidToggle(toggle, dt);
                });
                globalState.bars.forEach((bar) => {
                    updateBarMotion(bar, dt);
                    renderBar(bar);
                });

                globalState.frames += 1;
                updateDiagnostics(true);

                const shouldContinue = !barsAreSettled();
                if (shouldContinue && !document.hidden) {
                    globalState.raf = window.requestAnimationFrame(tick);
                } else {
                    stopLoop();
                }
            }

            function resizeAll() {
                globalState.dpr = 1;
                updateColorBlockLayout();
                globalState.bars.forEach((bar) => resizeBar(bar));
                globalState.geometryDirty = false;
                requestLoop();
            }

            function kubeSmootherstep(value) {
                const x = Math.max(0, Math.min(1, value));
                return x * x * x * (x * (x * 6 - 15) + 10);
            }

            function kubeConvexSquircle(distanceFromSide) {
                const x = Math.max(0, Math.min(1, distanceFromSide));
                return Math.pow(
                    Math.max(0, 1 - Math.pow(1 - x, 4)),
                    0.25
                );
            }

            function buildKubeDisplacementMap(bezelWidthPx = 14) {
                const size = 256;
                const canvas = document.createElement("canvas");
                canvas.width = size;
                canvas.height = size;
                const context = canvas.getContext("2d", {
                    willReadFrequently: true,
                });
                const image = context.createImageData(size, size);
                const bezel = Math.max(0.055, Math.min(0.42, bezelWidthPx / 72));
                const exponent = 4;
                for (let y = 0; y < size; y += 1) {
                    for (let x = 0; x < size; x += 1) {
                        const px = (x + 0.5) / size * 2 - 1;
                        const py = (y + 0.5) / size * 2 - 1;
                        const ax = Math.abs(px);
                        const ay = Math.abs(py);
                        const squircleRadius = Math.pow(
                            Math.pow(ax, exponent)
                                + Math.pow(ay, exponent),
                            1 / exponent
                        );
                        const distanceFromSide = Math.max(
                            0,
                            Math.min(1, (1 - squircleRadius) / bezel)
                        );
                        const surfaceHeight =
                            kubeConvexSquircle(distanceFromSide);
                        const surfaceEdge =
                            1 - kubeSmootherstep(distanceFromSide);
                        const normalX = Math.sign(px)
                            * Math.pow(ax, exponent - 1);
                        const normalY = Math.sign(py)
                            * Math.pow(ay, exponent - 1);
                        const normalLength = Math.hypot(normalX, normalY) || 1;
                        const bend =
                            surfaceEdge
                            * surfaceHeight
                            * (0.54 + 0.46 * (1 - distanceFromSide));
                        const offset = (y * size + x) * 4;
                        image.data[offset] =
                            128
                            + Math.round(normalX / normalLength * bend * 116);
                        image.data[offset + 1] =
                            128
                            + Math.round(normalY / normalLength * bend * 116);
                        image.data[offset + 2] =
                            128 + Math.round(surfaceHeight * surfaceEdge * 84);
                        image.data[offset + 3] = 255;
                    }
                }
                context.putImageData(image, 0, 0);
                return canvas.toDataURL("image/png");
            }

            function updateKubeDisplacementMap(bezelWidthPx) {
                const displacementImage = document.getElementById(
                    "kube-displacement-image"
                );
                if (!displacementImage) return;
                const href = buildKubeDisplacementMap(bezelWidthPx);
                displacementImage.setAttribute("href", href);
                displacementImage.setAttributeNS(
                    "http://www.w3.org/1999/xlink",
                    "href",
                    href
                );
            }

            function initKubeSettings() {
                const kubeStage = document.querySelector("[data-kube-stage]");
                if (!kubeStage) return;
                const stageDisplacement = document.getElementById(
                    "kube-refraction-map"
                );
                const thumbDisplacement = document.getElementById(
                    "kube-thumb-displacement"
                );
                const thumbSaturation = document.getElementById(
                    "kube-thumb-saturation"
                );
                const thumbBlur = document.getElementById("kube-thumb-blur");
                const thumbSpecularAlpha = document.getElementById(
                    "kube-thumb-specular-alpha"
                );
                const state = {
                    specularOpacity: 0,
                    specularSaturation: 6,
                    refractionLevel: 1,
                    blurLevel: 0.2,
                    progressiveBlur: 0,
                    glassBackgroundOpacity: 0.5,
                };
                updateKubeDisplacementMap(14);
                const renderState = () => {
                    stageDisplacement?.setAttribute(
                        "scale",
                        (state.refractionLevel * 50.08645714048877).toFixed(8)
                    );
                    thumbDisplacement?.setAttribute(
                        "scale",
                        (state.refractionLevel * 50.08645714048877).toFixed(8)
                    );
                    thumbSaturation?.setAttribute(
                        "values",
                        String(Math.round(state.specularSaturation))
                    );
                    thumbBlur?.setAttribute(
                        "stdDeviation",
                        state.blurLevel.toFixed(2)
                    );
                    thumbSpecularAlpha?.setAttribute(
                        "slope",
                        state.specularOpacity.toFixed(2)
                    );
                    kubeStage.style.setProperty(
                        "--kube-refraction-level",
                        `${(state.refractionLevel * 22).toFixed(2)}px`
                    );
                    kubeStage.style.setProperty(
                        "--kube-blue-opacity",
                        `${Math.max(0.06, state.glassBackgroundOpacity * 0.36).toFixed(2)}`
                    );
                    kubeStage.style.setProperty(
                        "--kube-glass-background-opacity",
                        `${Math.max(0.04, state.glassBackgroundOpacity * 0.196).toFixed(3)}`
                    );
                    kubeStage.style.setProperty(
                        "--kube-specular-opacity",
                        `${Math.max(state.specularOpacity, 0.28).toFixed(2)}`
                    );
                    kubeStage.style.setProperty(
                        "--kube-blur",
                        `${state.blurLevel.toFixed(2)}px`
                    );
                    kubeStage.style.setProperty(
                        "--kube-progressive-blur",
                        `${(state.progressiveBlur * 10).toFixed(2)}px`
                    );
                };
                document
                    .querySelectorAll("[data-kube-param]")
                    .forEach((input) => {
                        const output = input
                            .closest(".kube-param")
                            ?.querySelector("output");
                        const render = () => {
                            const value = Number(input.value);
                            state[input.dataset.kubeParam] = value;
                            const formatted =
                                input.dataset.kubeParam === "specularSaturation"
                                    ? String(Math.round(value))
                                    : value.toFixed(2);
                            if (output) output.textContent = formatted;
                            renderState();
                        };
                        input.addEventListener("input", render);
                        render();
                    });
                renderState();
            }

            tuningReset?.addEventListener("click", resetTuningControls);

            reduceMotionQuery.addEventListener?.("change", (event) => {
                globalState.bars.forEach((bar) => {
                    bar.motionOff = event.matches;
                });
                globalState.toggles.forEach((toggle) => {
                    toggle.motionOff = event.matches;
                });
                if (event.matches) {
                    globalState.motionEnabled = false;
                }
                requestLoop();
            });

            document.addEventListener("visibilitychange", () => {
                if (document.hidden) stopLoop();
                else requestLoop();
            });

            window.addEventListener("scroll", () => {
                globalState.geometryDirty = true;
                requestLoop();
            }, { passive: true });

            const resizeObserver = new ResizeObserver(() => resizeAll());
            resizeObserver.observe(stage);
            const barVisibilityObserver = "IntersectionObserver" in window
                ? new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        const bar = globalState.bars.find(
                            (candidate) => candidate.root === entry.target
                        );
                        if (!bar) return;
                        bar.visible = entry.isIntersecting;
                        bar.root.dataset.visible = String(entry.isIntersecting);
                        if (entry.isIntersecting) {
                            globalState.geometryDirty = true;
                            requestLoop();
                        }
                    });
                }, { rootMargin: "120px 0px", threshold: 0 })
                : null;

            renderTuningControls();
            initKubeSettings();
            updateColorBlockLayout();
            document.querySelectorAll("[data-optical-switch]").forEach((root) => {
                if (isHiddenTree(root)) return;
                createOpticalBar(root);
                barVisibilityObserver?.observe(root);
            });
            document.querySelectorAll("[data-liquid-range]").forEach((root) => {
                if (isHiddenTree(root)) return;
                createLiquidRange(root);
                barVisibilityObserver?.observe(root);
            });
            document.querySelectorAll("[data-liquid-square]").forEach((root) => {
                if (isHiddenTree(root)) return;
                createSquareGlass(root);
                barVisibilityObserver?.observe(root);
            });
            document.querySelectorAll("[data-liquid-toggle]").forEach((root) => {
                if (isHiddenTree(root)) return;
                createLiquidToggle(root);
                barVisibilityObserver?.observe(root);
            });
            updateRendererBadge();
            document.fonts?.ready?.then(() => requestLoop());
            requestLoop();
        })();
    </script>
</body>
</html>
